<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro Intelligence | Dados de Chuva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Biblioteca de Gráficos nativa -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Plugin para escrever valores em cima das barras -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    
    <!-- Header -->
    <header class="bg-[#1a472a] text-white p-4 flex justify-between items-center shadow-md z-10">
        <a href="dashboard.html" style="text-decoration: none; color: white; font-size: 14px; font-weight: bold;">
            ← Painel
        </a>
        <div class="flex items-center gap-2">
            <img src="logo.png" alt="Logo" class="h-8 w-8 object-contain" onerror="this.style.display='none'">
            <div class="text-right">
                <h1 class="text-lg font-bold">Agro Intelligence</h1>
                <p class="text-xs opacity-80">Dados Pluviométricos</p>
            </div>
        </div>
        <div style="width: 50px;"></div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-4 md:p-8 flex flex-col items-center w-full max-w-5xl mx-auto">
        
        <!-- Card de Seleção -->
        <div class="w-full bg-white rounded-xl shadow-lg p-6 mb-6 border border-gray-100">
            <h2 class="text-xl font-bold text-gray-800 mb-4">🌧️ Histórico e Previsão de Chuvas</h2>
            <div class="flex flex-col gap-4">
                <select id="select-cidade" class="w-full p-3 border border-gray-300 rounded-lg text-gray-700 focus:ring-2 focus:ring-green-500 outline-none">
                    <option value="">-- Selecione o Município --</option>
                    <option value='{"lat": -20.4226, "lon": -49.9725}'>Votuporanga - SP</option>
                    <option value='{"lat": -21.0419, "lon": -49.7636}'>Tanabi - SP</option>
                    <option value='{"lat": -20.7889, "lon": -49.4031}'>São José do Rio Preto - SP</option>
                    <option value='{"lat": -20.6219, "lon": -49.0658}'>Mirassol - SP</option>
                    <option value='{"lat": -19.9333, "lon": -50.4878}'>Fernandópolis - SP</option>
                </select>
                
                <button onclick="buscarDados()" class="bg-[#1a472a] text-white font-bold py-3 px-4 rounded-lg hover:bg-[#2d8659] transition duration-200">
                    Buscar Dados
                </button>
            </div>
        </div>

        <div id="status-chuva" class="text-gray-500 text-sm text-center hidden p-3 rounded-lg bg-gray-50 mb-6">Processando...</div>

        <!-- Gráficos -->
        <div class="w-full bg-white rounded-xl shadow-lg p-6 mb-6 border border-gray-100">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-700">Previsão Próximos 15 Dias</h3>
                <span id="total-previsao" class="bg-blue-100 text-blue-800 text-sm font-bold px-3 py-1 rounded-full">0 mm</span>
            </div>
            <canvas id="graficoPrevisao" height="100"></canvas>
        </div>

        <div class="w-full bg-white rounded-xl shadow-lg p-6 mb-6 border border-gray-100">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-700">15 Dias (Detalhado)</h3>
                <span id="total-15" class="bg-green-100 text-green-800 text-sm font-bold px-3 py-1 rounded-full">0 mm</span>
            </div>
            <canvas id="grafico15dias" height="100"></canvas>
        </div>

        <div class="w-full bg-white rounded-xl shadow-lg p-6 mb-6 border border-gray-100">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-700">Últimos 3 Meses</h3>
                <span id="total-3meses" class="bg-teal-100 text-teal-800 text-sm font-bold px-3 py-1 rounded-full">0 mm</span>
            </div>
            <canvas id="grafico3meses" height="100"></canvas>
        </div>

        <div class="w-full bg-white rounded-xl shadow-lg p-6 mb-6 border border-gray-100">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-700">Últimos 12 Meses (Tendência)</h3>
                <span id="total-12meses" class="bg-green-100 text-green-800 text-sm font-bold px-3 py-1 rounded-full">0 mm</span>
            </div>
            <canvas id="grafico12meses" height="100"></canvas>
        </div>

    </main>

    <script>
        const supabaseUrl = 'https://keiydgyountsuzjybsng.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtlaXlkZ3lvdW50c3V6anlic25nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1ODY1MTksImV4cCI6MjA5ODE2MjUxOX0.Cd3TqUBZsNWV00AZGkrElJVmNlWPccDgtl-n95BVwjg';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        // Registra o plugin de texto nas barras
        Chart.register(ChartDataLabels);

        window.onload = async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
                return;
            }
        };

        function formatarDataLabel(dataStr) {
            const partes = dataStr.split('-');
            return `${partes[2]}/${partes[1]}`;
        }

        function formatarData(date) {
            return date.toISOString().split('T')[0];
        }

        async function buscarDados() {
            const select = document.getElementById('select-cidade');
            const cidadeValue = select.value;
            
            if (!cidadeValue) {
                alert("Selecione um município.");
                return;
            }

            const coords = JSON.parse(cidadeValue);
            const lat = coords.lat;
            const lon = coords.lon;

            const status = document.getElementById('status-chuva');
            status.classList.remove('hidden');
            status.innerText = "Buscando dados na nuvem... Isso pode levar alguns segundos.";

            try {
                const dataFim = new Date();
                const dataInicio12Meses = new Date();
                dataInicio12Meses.setFullYear(dataFim.getFullYear() - 1);

                const inicio = formatarData(dataInicio12Meses);
                const fim = formatarData(dataFim);

                // 1. Busca Histórico (12 meses)
                const urlHistorico = `https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=${inicio}&end_date=${fim}&daily=precipitation_sum&timezone=America/Sao_Paulo`;
                const resHist = await fetch(urlHistorico);
                const dataHist = await resHist.json();

                // 2. Busca Previsão (15 dias)
                const urlPrevisao = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=precipitation_sum&timezone=America/Sao_Paulo&forecast_days=15`;
                const resPrev = await fetch(urlPrevisao);
                const dataPrev = await resPrev.json();

                if (dataHist && dataHist.daily && dataPrev && dataPrev.daily) {
                    
                    // Processa Histórico
                    const todasDatas = dataHist.daily.time;
                    const todaChuva = dataHist.daily.precipitation_sum.map(v => v === null ? 0 : v);

                    // Processa Previsão
                    const datasPrev = dataPrev.daily.time;
                    const chuvaPrev = dataPrev.daily.precipitation_sum.map(v => v === null ? 0 : v);

                    // Calcula Totais
                    const total15 = todaChuva.slice(-15).reduce((a, b) => a + b, 0);
                    const total3 = todaChuva.slice(-90).reduce((a, b) => a + b, 0);
                    const total12 = todaChuva.reduce((a, b) => a + b, 0);
                    const totalPrev = chuvaPrev.reduce((a, b) => a + b, 0);

                    // Atualiza Etiquetas
                    document.getElementById('total-previsao').innerText = totalPrev.toFixed(1) + " mm";
                    document.getElementById('total-15').innerText = total15.toFixed(1) + " mm";
                    document.getElementById('total-3meses').innerText = total3.toFixed(1) + " mm";
                    document.getElementById('total-12meses').innerText = total12.toFixed(1) + " mm";
                    status.classList.add('hidden');

                    // Formata datas para DD/MM
                    const datas15Fmt = todasDatas.slice(-15).map(formatarDataLabel);
                    const datas3Fmt = todasDatas.slice(-90).map(formatarDataLabel);
                    const datas12Fmt = todasDatas.map(formatarDataLabel);
                    const datasPrevFmt = datasPrev.map(formatarDataLabel);

                    // Desenha Gráficos
                    desenharGrafico('graficoPrevisao', datasPrevFmt, chuvaPrev, 'bar', 'rgba(59, 130, 246, 0.7)', true);
                    desenharGrafico('grafico15dias', datas15Fmt, todaChuva.slice(-15), 'bar', 'rgba(54, 162, 235, 0.7)', true);
                    desenharGrafico('grafico3meses', datas3Fmt, todaChuva.slice(-90), 'bar', 'rgba(75, 192, 192, 0.7)', false);
                    desenharGrafico('grafico12meses', datas12Fmt, todaChuva, 'line', 'rgba(26, 71, 42, 0.8)', false);

                } else {
                    status.innerText = "Não foi possível obter dados para este município.";
                }
            } catch (error) {
                status.innerText = "Erro ao buscar dados: " + error.message;
            }
        }

        function desenharGrafico(canvasId, labels, dados, tipo, cor, mostrarValores) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            
            let graficoExistente = Chart.getChart(canvasId);
            if (graficoExistente) {
                graficoExistente.destroy();
            }

            new Chart(ctx, {
                type: tipo,
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Precipitação (mm)',
                        data: dados,
                        backgroundColor: cor,
                        borderColor: cor,
                        borderWidth: tipo === 'line' ? 2 : 1,
                        fill: tipo === 'line' ? true : false,
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return `Chuva: ${context.raw.toFixed(1)} mm`;
                                }
                            }
                        },
                        datalabels: {
                            display: mostrarValores, // Só mostra valores se for true (15 dias e Previsão)
                            align: 'end',
                            anchor: 'end',
                            color: '#333',
                            font: { weight: 'bold', size: 10 },
                            formatter: (value) => value > 0 ? value.toFixed(0) : ''
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { display: false } // Remove linhas horizontais
                        },
                        x: { 
                            grid: { display: false } // Remove linhas verticais
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
