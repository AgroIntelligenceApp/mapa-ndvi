<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro Intelligence | Dados de Chuva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Biblioteca de Gráficos nativa -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    
    <!-- Header -->
    <header class="bg-[#1a472a] text-white p-4 flex justify-between items-center shadow-md z-10">
        <a href="dashboard.html" style="text-decoration: none; color: white; font-size: 14px; font-weight: bold;">
            ← Painel
        </a>
        <div class="flex items-center gap-2">
            <img src="logo.png" alt="Logo" class="h-8 w-8 object-contain" onerror="this.style.display='none'">
            <div class="text-right">
                <h1 class="text-lg font-bold">Agro Intelligence</h1>
                <p class="text-xs opacity-80">Dados Pluviométricos</p>
            </div>
        </div>
        <div style="width: 50px;"></div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-4 md:p-8 flex flex-col items-center w-full max-w-5xl mx-auto">
        
        <!-- Card de Seleção -->
        <div class="w-full bg-white rounded-xl shadow-lg p-6 mb-6 border border-gray-100">
            <h2 class="text-xl font-bold text-gray-800 mb-4">🌧️ Histórico de Chuvas</h2>
            <div class="flex flex-col gap-4">
                <select id="select-cidade" class="w-full p-3 border border-gray-300 rounded-lg text-gray-700 focus:ring-2 focus:ring-green-500 outline-none">
                    <option value="">-- Selecione o Município --</option>
                    <!-- Adicione mais cidades aqui no formato: {"nome": "Cidade - UF", "lat": -20.42, "lon": -49.97} -->
                    <option value='{"lat": -20.4226, "lon": -49.9725}'>Votuporanga - SP</option>
                    <option value='{"lat": -21.0419, "lon": -49.7636}'>Tanabi - SP</option>
                    <option value='{"lat": -20.7889, "lon": -49.4031}'>São José do Rio Preto - SP</option>
                    <option value='{"lat": -20.6219, "lon": -49.0658}'>Mirassol - SP</option>
                    <option value='{"lat": -19.9333, "lon": -50.4878}'>Fernandópolis - SP</option>
                </select>
                
                <button onclick="buscarDados()" class="bg-[#1a472a] text-white font-bold py-3 px-4 rounded-lg hover:bg-[#2d8659] transition duration-200">
                    Buscar Dados
                </button>
            </div>
        </div>

        <!-- Card Total Acumulado -->
        <div id="card-total" class="w-full bg-[#1a472a] text-white rounded-xl shadow-lg p-6 mb-6 hidden">
            <div class="text-center">
                <p class="text-sm uppercase tracking-wider opacity-80">Volume Acumulado (Últimos 12 Meses)</p>
                <p id="total-acumulado" class="text-4xl font-bold my-2">0 mm</p>
            </div>
        </div>

        <!-- Status de Carregamento -->
        <div id="status-chuva" class="text-gray-500 text-sm text-center hidden p-3 rounded-lg bg-gray-50 mb-6">Processando...</div>

        <!-- Gráficos -->
        <div class="w-full bg-white rounded-xl shadow-lg p-6 mb-6 border border-gray-100">
            <h3 class="text-lg font-bold text-gray-700 mb-4">15 Dias (Detalhado)</h3>
            <canvas id="grafico15dias" height="100"></canvas>
        </div>

        <div class="w-full bg-white rounded-xl shadow-lg p-6 mb-6 border border-gray-100">
            <h3 class="text-lg font-bold text-gray-700 mb-4">Últimos 3 Meses</h3>
            <canvas id="grafico3meses" height="100"></canvas>
        </div>

        <div class="w-full bg-white rounded-xl shadow-lg p-6 mb-6 border border-gray-100">
            <h3 class="text-lg font-bold text-gray-700 mb-4">Últimos 12 Meses (Tendência)</h3>
            <canvas id="grafico12meses" height="100"></canvas>
        </div>

    </main>

    <script>
        const supabaseUrl = 'https://keiydgyountsuzjybsng.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtlaXlkZ3lvdW50c3V6anlic25nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1ODY1MTksImV4cCI6MjA5ODE2MjUxOX0.Cd3TqUBZsNWV00AZGkrElJVmNlWPccDgtl-n95BVwjg';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let grafico15 = null;
        let grafico3 = null;
        let grafico12 = null;

        window.onload = async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
                return;
            }
        };

        // Formata a data para YYYY-MM-DD (padrão da API)
        function formatarData(date) {
            return date.toISOString().split('T')[0];
        }

        async function buscarDados() {
            const select = document.getElementById('select-cidade');
            const cidadeValue = select.value;
            
            if (!cidadeValue) {
                alert("Selecione um município.");
                return;
            }

            const coords = JSON.parse(cidadeValue);
            const lat = coords.lat;
            const lon = coords.lon;

            const status = document.getElementById('status-chuva');
            const cardTotal = document.getElementById('card-total');
            
            status.classList.remove('hidden');
            cardTotal.classList.add('hidden');
            status.innerText = "Buscando dados na nuvem... Isso pode levar alguns segundos.";

            try {
                const dataFim = new Date();
                const dataInicio12Meses = new Date();
                dataInicio12Meses.setFullYear(dataFim.getFullYear() - 1);

                const inicio = formatarData(dataInicio12Meses);
                const fim = formatarData(dataFim);

                // API de Arquivo do Open-Meteo (Histórico)
                const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=${inicio}&end_date=${fim}&daily=precipitation_sum&timezone=America/Sao_Paulo`;
                
                const response = await fetch(url);
                const data = await response.json();

                if (data && data.daily && data.daily.time) {
                    const todasDatas = data.daily.time;
                    const todaChuva = data.daily.precipitation_sum.map(v => v === null ? 0 : v);

                    // 1. Calcular Total Acumulado (12 meses)
                    const totalAcumulado = todaChuva.reduce((a, b) => a + b, 0);
                    document.getElementById('total-acumulado').innerText = totalAcumulado.toFixed(1) + " mm";
                    cardTotal.classList.remove('hidden');
                    status.classList.add('hidden');

                    // 2. Separar os arrays para os gráficos
                    // 15 dias (últimos 15 elementos)
                    const datas15 = todasDatas.slice(-15);
                    const chuva15 = todaChuva.slice(-15);

                    // 3 meses (aprox 90 dias)
                    const datas3 = todasDatas.slice(-90);
                    const chuva3 = todaChuva.slice(-90);

                    // 12 meses (tudo)
                    const datas12 = todasDatas;
                    const chuva12 = todaChuva;

                    desenharGrafico('grafico15dias', datas15, chuva15, 'bar', 'rgba(54, 162, 235, 0.7)');
                    desenharGrafico('grafico3meses', datas3, chuva3, 'bar', 'rgba(75, 192, 192, 0.7)');
                    desenharGrafico('grafico12meses', datas12, chuva12, 'line', 'rgba(26, 71, 42, 0.8)');

                } else {
                    status.innerText = "Não foi possível obter dados para este município.";
                }
            } catch (error) {
                status.innerText = "Erro ao buscar dados: " + error.message;
            }
        }

        function desenharGrafico(canvasId, labels, dados, tipo, cor) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            
            // Se já existe um gráfico, destroi para desenhar o novo
            let graficoExistente = Chart.getChart(canvasId);
            if (graficoExistente) {
                graficoExistente.destroy();
            }

            new Chart(ctx, {
                type: tipo,
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Precipitação (mm)',
                        data: dados,
                        backgroundColor: cor,
                        borderColor: cor,
                        borderWidth: tipo === 'line' ? 2 : 1,
                        fill: tipo === 'line' ? true : false,
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return `Chuva: ${context.raw.toFixed(1)} mm`;
                                }
                            }
                        }
                    },
                    scales: {
                        y: { beginAtZero: true },
                        x: { 
                            ticks: {
                                maxRotation: 45,
                                minRotation: 45,
                                autoSkip: true,
                                maxTicksLimit: 12
                            }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
