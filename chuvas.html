<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro Intelligence | Dados de Chuva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Bibliotecas de Gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
    <style>
        .resultados-busca { max-height: 200px; overflow-y: auto; }
        .item-busca:hover { background-color: #f0f0f0; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    
    <header class="bg-[#1a472a] text-white p-4 flex justify-between items-center shadow-md z-10">
        <a href="dashboard.html" style="text-decoration: none; color: white; font-size: 14px; font-weight: bold;">← Painel</a>
        <div class="flex items-center gap-2">
            <img src="logo.png" alt="Logo" class="h-8 w-8 object-contain" onerror="this.style.display='none'">
            <div class="text-right">
                <h1 class="text-lg font-bold">Agro Intelligence</h1>
                <p class="text-xs opacity-80">Dados Pluviométricos</p>
            </div>
        </div>
        <div style="width: 50px;"></div>
    </header>

    <main class="flex-1 p-4 md:p-8 flex flex-col items-center w-full max-w-5xl mx-auto">
        
        <div class="w-full bg-white rounded-xl shadow-lg p-6 mb-6 border border-gray-100">
            <h2 class="text-xl font-bold text-gray-800 mb-4">🌧️ Histórico de Chuvas</h2>
            
            <!-- NOVA CAIXA DE BUSCA INTELIGENTE -->
            <label class="block text-sm font-medium text-gray-300 mb-1 text-gray-600">Buscar Município</label>
            <div class="relative">
                <input type="text" id="input-cidade" oninput="buscarCidades()" placeholder="Digite o nome da cidade (ex: Uberaba)" class="w-full p-3 border border-gray-300 rounded-lg text-gray-700 focus:ring-2 focus:ring-green-500 outline-none">
                <div id="resultados-busca" class="resultados-busca absolute z-10 w-full bg-white border border-gray-300 rounded-lg mt-1 hidden"></div>
            </div>
            
            <button onclick="buscarDados()" class="w-full bg-[#1a472a] text-white font-bold py-3 px-4 rounded-lg hover:bg-[#2d8659] transition duration-200 mt-4">
                Buscar Dados
            </button>
        </div>

        <div id="status-chuva" class="text-gray-500 text-sm text-center hidden p-3 rounded-lg bg-gray-50 mb-6">Processando...</div>

        <!-- Gráficos -->
        <div class="w-full bg-white rounded-xl shadow-lg p-6 mb-6 border border-gray-100">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-700">Previsão Próximos 15 Dias</h3>
                <span id="total-previsao" class="bg-blue-100 text-blue-800 text-sm font-bold px-3 py-1 rounded-full">0 mm</span>
            </div>
            <canvas id="graficoPrevisao" height="100"></canvas>
        </div>

        <div class="w-full bg-white rounded-xl shadow-lg p-6 mb-6 border border-gray-100">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-700">15 Dias (Detalhado)</h3>
                <span id="total-15" class="bg-green-100 text-green-800 text-sm font-bold px-3 py-1 rounded-full">0 mm</span>
            </div>
            <canvas id="grafico15dias" height="100"></canvas>
        </div>

        <div class="w-full bg-white rounded-xl shadow-lg p-6 mb-6 border border-gray-100">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-700">Últimos 3 Meses</h3>
                <span id="total-3meses" class="bg-teal-100 text-teal-800 text-sm font-bold px-3 py-1 rounded-full">0 mm</span>
            </div>
            <canvas id="grafico3meses" height="100"></canvas>
        </div>

        <div class="w-full bg-white rounded-xl shadow-lg p-6 mb-6 border border-gray-100">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-700">Acumulado por Mês (Últimos 12 Meses)</h3>
                <span id="total-12meses" class="bg-blue-100 text-blue-800 text-sm font-bold px-3 py-1 rounded-full">0 mm</span>
            </div>
            <canvas id="grafico12meses" height="100"></canvas>
        </div>

    </main>

    <script>
        const supabaseClient = supabase.createClient('https://keiydgyountsuzjybsng.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtlaXlkZ3lvdW50c3V6anlic25nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1ODY1MTksImV4cCI6MjA5ODE2MjUxOX0.Cd3TqUBZsNWV00AZGkrElJVmNlWPccDgtl-n95BVwjg');
        Chart.register(ChartDataLabels);

        let cidadeSelecionada = null;

        window.onload = async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) window.location.href = 'index.html';
        };

        // NOVA FUNÇÃO: BUSCA DE CIDADES NA INTERNET
        async function buscarCidades() {
            const texto = document.getElementById('input-cidade').value.trim();
            const divResultados = document.getElementById('resultados-busca');
            
            if (texto.length < 3) {
                divResultados.classList.add('hidden');
                divResultados.innerHTML = '';
                return;
            }

            const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${texto}&count=5&language=pt&format=json`);
            const data = await res.json();

            divResultados.innerHTML = '';
            if (data.results) {
                data.results.forEach(c => {
                    let btn = document.createElement('div');
                    btn.className = 'item-busca p-2 cursor-pointer border-b text-gray-700 text-sm';
                    btn.innerText = `${c.name} - ${c.admin1 || ''} (${c.country_code})`;
                    btn.onclick = () => selecionarCidade(c);
                    divResultados.appendChild(btn);
                });
                divResultados.classList.remove('hidden');
            } else {
                divResultados.classList.add('hidden');
            }
        }

        function selecionarCidade(c) {
            cidadeSelecionada = { lat: c.latitude, lon: c.longitude, nome: c.name };
            document.getElementById('input-cidade').value = `${c.name} - ${c.admin1 || ''}`;
            document.getElementById('resultados-busca').classList.add('hidden');
        }

        function formatarDataLabel(dataStr) {
            const partes = dataStr.split('-');
            return `${partes[2]}/${partes[1]}`;
        }

        function formatarData(date) {
            return date.toISOString().split('T')[0];
        }

        async function buscarDados() {
            if (!cidadeSelecionada) {
                alert("Digite e selecione uma cidade na lista de busca.");
                return;
            }

            const lat = cidadeSelecionada.lat;
            const lon = cidadeSelecionada.lon;

            const status = document.getElementById('status-chuva');
            status.classList.remove('hidden');
            status.innerText = "Buscando dados na nuvem... Isso pode levar alguns segundos.";

            try {
                const dataFim = new Date();
                const dataInicio12Meses = new Date();
                dataInicio12Meses.setFullYear(dataFim.getFullYear() - 1);

                const inicio = formatarData(dataInicio12Meses);
                const fim = formatarData(dataFim);

                const urlHistorico = `https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=${inicio}&end_date=${fim}&daily=precipitation_sum&timezone=America/Sao_Paulo`;
                const resHist = await fetch(urlHistorico);
                const dataHist = await resHist.json();

                const urlPrevisao = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=precipitation_sum&timezone=America/Sao_Paulo&forecast_days=15`;
                const resPrev = await fetch(urlPrevisao);
                const dataPrev = await resPrev.json();

                if (dataHist && dataHist.daily && dataPrev && dataPrev.daily) {
                    
                    const todasDatas = dataHist.daily.time;
                    const todaChuva = dataHist.daily.precipitation_sum.map(v => v === null ? 0 : v);
                    const datasPrev = dataPrev.daily.time;
                    const chuvaPrev = dataPrev.daily.precipitation_sum.map(v => v === null ? 0 : v);

                    const total15 = todaChuva.slice(-15).reduce((a, b) => a + b, 0);
                    const total3 = todaChuva.slice(-90).reduce((a, b) => a + b, 0);
                    const totalPrev = chuvaPrev.reduce((a, b) => a + b, 0);

                    document.getElementById('total-previsao').innerText = totalPrev.toFixed(1) + " mm";
                    document.getElementById('total-15').innerText = total15.toFixed(1) + " mm";
                    document.getElementById('total-3meses').innerText = total3.toFixed(1) + " mm";
                    status.classList.add('hidden');

                    const datas15Fmt = todasDatas.slice(-15).map(formatarDataLabel);
                    const datas3Fmt = todasDatas.slice(-90).map(formatarDataLabel);
                    const datasPrevFmt = datasPrev.map(formatarDataLabel);

                    // Lógica: Agrupar 12 meses por Mês e Ano
                    const mesesNomes = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
                    let monthlyData = {};
                    for (let i = 0; i < todasDatas.length; i++) {
                        let ym = todasDatas[i].substring(0, 7);
                        let val = todaChuva[i] === null ? 0 : todaChuva[i];
                        if (!monthlyData[ym]) monthlyData[ym] = 0;
                        monthlyData[ym] += val;
                    }

                    let datas12Fmt = [];
                    let chuva12 = [];
                    let hoje = new Date();
                    let total12 = 0;
                    
                    for (let i = 11; i >= 0; i--) {
                        let d = new Date(hoje.getFullYear(), hoje.getMonth() - i, 1);
                        let ym = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                        let ano2 = String(d.getFullYear()).substring(2); // Pega "26" de 2026
                        datas12Fmt.push(`${mesesNomes[d.getMonth()]}/${ano2}`); // Formato: Jan/26
                        let valMes = monthlyData[ym] || 0;
                        chuva12.push(valMes);
                        total12 += valMes;
                    }

                    document.getElementById('total-12meses').innerText = total12.toFixed(1) + " mm";

                    // Desenha Gráficos
                    desenharGrafico('graficoPrevisao', datasPrevFmt, chuvaPrev, 'bar', 'rgba(59, 130, 246, 0.7)', true);
                    desenharGrafico('grafico15dias', datas15Fmt, todaChuva.slice(-15), 'bar', 'rgba(54, 162, 235, 0.7)', true);
                    desenharGrafico('grafico3meses', datas3Fmt, todaChuva.slice(-90), 'bar', 'rgba(75, 192, 192, 0.7)', false);
                    // Gráfico de 12 meses agora AZUL e com labels de Mês/Ano
                    desenharGrafico('grafico12meses', datas12Fmt, chuva12, 'bar', 'rgba(54, 162, 235, 0.7)', true);

                } else {
                    status.innerText = "Não foi possível obter dados para este município.";
                }
            } catch (error) {
                status.innerText = "Erro ao buscar dados: " + error.message;
            }
        }

        function desenharGrafico(canvasId, labels, dados, tipo, cor, mostrarValores) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            let graficoExistente = Chart.getChart(canvasId);
            if (graficoExistente) graficoExistente.destroy();

            new Chart(ctx, {
                type: tipo,
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Precipitação (mm)',
                        data: dados,
                        backgroundColor: cor,
                        borderColor: cor,
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false },
                        tooltip: { callbacks: { label: (c) => `Chuva: ${c.raw.toFixed(1)} mm` } },
                        datalabels: {
                            display: mostrarValores, align: 'end', anchor: 'end',
                            color: '#333', font: { weight: 'bold', size: 10 },
                            formatter: (value) => value > 0 ? value.toFixed(0) : ''
                        }
                    },
                    scales: {
                        y: { beginAtZero: true, grid: { display: false } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }
    </script>
</body>
</html>
