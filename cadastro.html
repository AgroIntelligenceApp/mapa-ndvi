<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cadastro de Talhões - Agro Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        .tab-active { background-color: #1a472a; color: white; }
        .tab-inactive { background-color: #374151; color: #9ca3af; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-lg bg-gray-800 rounded-2xl p-6 shadow-lg border border-gray-700">
        <div class="text-center mb-6">
            <a href="dashboard.html" class="text-gray-400 text-sm hover:text-white">← Voltar ao Painel</a>
            <div class="w-16 h-16 bg-green-600 rounded-full flex items-center justify-center mx-auto my-3 text-2xl font-bold">N</div>
            <h1 class="text-xl font-bold">Cadastro de Talhões</h1>
        </div>
        <div class="flex p-1 bg-gray-700 rounded-lg mb-6">
            <button id="tab-manual-btn" onclick="switchTab('manual')" class="tab-active flex-1 py-2 rounded-md font-bold transition">Manual (Demo)</button>
            <button id="tab-lote-btn" onclick="switchTab('lote')" class="tab-inactive flex-1 py-2 rounded-md font-bold transition">Em Lote (Excel)</button>
        </div>

        <!-- MANUAL -->
        <div id="form-manual" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <input type="tel" id="manual-whatsapp" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 text-white" placeholder="WhatsApp">
                <input type="text" id="manual-nome" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 text-white" placeholder="Nome Talhão">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <input type="text" id="manual-fazenda" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 text-white" placeholder="Fazenda">
                <input type="text" id="manual-bloco" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 text-white" placeholder="Bloco">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <input type="text" id="manual-variedade" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 text-white" placeholder="Variedade">
                <input type="text" id="manual-ambiente" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 text-white" placeholder="Ambiente">
            </div>
            <div class="grid grid-cols-3 gap-4">
                <select id="manual-tipo" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 text-white"><option>Plantio</option><option>Soca</option></select>
                <select id="manual-corte" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 text-white"><option value="1">1º</option><option value="2">2º</option><option value="3">3º</option></select>
                <input type="date" id="manual-data-pl" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 text-white">
            </div>
            <input type="file" id="manual-arquivo" accept=".kml,.kmz" required class="w-full text-sm text-gray-400 bg-gray-700 border border-gray-600 rounded-lg cursor-pointer">
            <div id="statusManual" class="text-sm text-center hidden p-3 rounded-lg"></div>
            <button type="button" onclick="enviarManual()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg">Cadastrar</button>
        </div>

        <!-- LOTE -->
        <div id="form-lote" class="space-y-4 hidden">
            <button onclick="baixarModelo()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg">📥 Baixar Modelo de Excel</button>
            <input type="tel" id="lote-whatsapp" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 text-white" placeholder="WhatsApp do Cliente">
            <input type="file" id="lote-excel" accept=".xlsx, .csv" class="w-full text-sm text-gray-400 bg-gray-700 border border-gray-600 rounded-lg cursor-pointer">
            <input type="file" id="lote-kml" accept=".kml,.kmz" class="w-full text-sm text-gray-400 bg-gray-700 border border-gray-600 rounded-lg cursor-pointer">
            <div id="statusLote" class="text-sm text-center hidden p-3 rounded-lg"></div>
            <button type="button" onclick="enviarLote()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg">Cadastrar Lote</button>
        </div>
    </div>

    <script>
        const sb = window.supabase.createClient('https://keiydgyountsuzjybsng.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtlaXlkZ3lvdW50c3V6anlic25nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1ODY1MTksImV4cCI6MjA5ODE2MjUxOX0.Cd3TqUBZsNWV00AZGkrElJVmNlWPccDgtl-n95BVwjg');

        function switchTab(t) {
            document.getElementById('form-manual').classList.toggle('hidden', t !== 'manual');
            document.getElementById('form-lote').classList.toggle('hidden', t !== 'lote');
            document.getElementById('tab-manual-btn').className = (t === 'manual' ? 'tab-active' : 'tab-inactive') + " flex-1 py-2 rounded-md font-bold transition";
            document.getElementById('tab-lote-btn').className = (t === 'lote' ? 'tab-active' : 'tab-inactive') + " flex-1 py-2 rounded-md font-bold transition";
        }

        function baixarModelo() {
            const dados = [
                { talhao: "10", nome_fazenda: "São Jorge", codigo_bloco: "1010", ambiente_producao: "A1", variedade: "RB92579", tipo_plantio: "Plantio", numero_corte: 1, data_plantio: "2023-04-15", data_ultimo_corte: "", tch_planejado: 85.0, tch_realizado: 80.0, atr_planejado: 140, atr_realizado: 135 },
                { talhao: "11", nome_fazenda: "São Jorge", codigo_bloco: "1010", ambiente_producao: "A2", variedade: "CTC4", tipo_plantio: "Soca", numero_corte: 3, data_plantio: "", data_ultimo_corte: "2023-08-10", tch_planejado: 65.0, tch_realizado: 0, atr_planejado: 130, atr_realizado: 0 }
            ];
            const ws = XLSX.utils.json_to_sheet(dados);
            XLSX.writeFile(XLSX.utils.book_new(XLSX.utils.book_append_sheet(XLSX.utils.book_new(), ws, "Talhões")), "Modelo.xlsx");
        }

        function normalizarNome(str) { return String(str).replace(/\s+/g, '').toLowerCase(); }

        async function lerPoligonosDeKmlUnico(file) {
            let kmlText = file.name.toLowerCase().endsWith('.kmz') ? (await (await JSZip.loadAsync(file)).files[Object.keys((await JSZip.loadAsync(file)).files).find(f => f.endsWith('.kml'))].async('string')) : await file.text();
            const placemarks = new DOMParser().parseFromString(kmlText, 'text/xml').getElementsByTagName('Placemark');
            let poligonos = [];
            for (let pm of placemarks) {
                const nameEl = pm.getElementsByTagName('name')[0]; const coordsEl = pm.getElementsByTagName('coordinates')[0];
                if (!nameEl || !coordsEl) continue;
                const coordsArray = coordsEl.textContent.trim().split(/\s+/).map(c => [parseFloat(c.split(',')[0]), parseFloat(c.split(',')[1])]);
                if (coordsArray[0][0] !== coordsArray[coordsArray.length-1][0]) coordsArray.push(coordsArray[0]);
                poligonos.push({ nome: nameEl.textContent.trim(), geom: { "type": "Polygon", "coordinates": [coordsArray] } });
            }
            return poligonos;
        }

        async function enviarManual() {
            const msgEl = document.getElementById('statusManual');
            let whatsapp = document.getElementById('manual-whatsapp').value.replace(/\D/g, '');
            if (whatsapp.length === 9) whatsapp = "17" + whatsapp;
            const file = document.getElementById('manual-arquivo').files[0];
            if (!file || whatsapp.length < 11) return msgEl.innerText = "Dados incompletos.";
            
            try {
                let { data: cli } = await sb.from('clientes').select('id').eq('whatsapp', whatsapp).maybeSingle();
                let clienteId = cli ? cli.id : (await sb.from('clientes').insert({ nome: "Cliente " + whatsapp, whatsapp, ativo: true }).select('id').single()).data.id;
                let kmlText = file.name.endsWith('.kmz') ? await (await JSZip.loadAsync(file)).files[Object.keys((await JSZip.loadAsync(file)).files).find(f => f.endsWith('.kml'))].async('string') : await file.text();
                let coordsEl = new DOMParser().parseFromString(kmlText, 'text/xml').getElementsByTagName('coordinates')[0];
                if (!coordsEl) throw new Error("KML inválido.");
                let coordsArray = coordsEl.textContent.trim().split(/\s+/).map(c => [parseFloat(c.split(',')[0]), parseFloat(c.split(',')[1])]);
                if (coordsArray[0][0] !== coordsArray[coordsArray.length-1][0]) coordsArray.push(coordsArray[0]);
                await sb.from('talhoes').insert({ id: crypto.randomUUID(), cliente_id: clienteId, codigo_talhao: document.getElementById('manual-nome').value.substring(0, 20), nome_fazenda: document.getElementById('manual-fazenda').value || 'N/D', codigo_bloco: document.getElementById('manual-bloco').value || '', ambiente_producao: document.getElementById('manual-ambiente').value || 'N/D', geom: { type: "Polygon", coordinates: [coordsArray] }, variedade: document.getElementById('manual-variedade').value || 'N/D', tipo_plantio: document.getElementById('manual-tipo').value, numero_corte: parseInt(document.getElementById('manual-corte').value), data_plantio: document.getElementById('manual-data-pl').value || null });
                msgEl.className = 'text-sm text-center p-3 rounded-lg bg-green-900 text-green-200';
                msgEl.innerHTML = `<b>SUCESSO!</b>`;
            } catch (e) { msgEl.className = 'text-sm text-center p-3 rounded-lg bg-red-900 text-red-300'; msgEl.innerText = "Erro: " + e.message; }
        }

        async function enviarLote() {
            const msgEl = document.getElementById('statusLote');
            let whatsapp = document.getElementById('lote-whatsapp').value.replace(/\D/g, '');
            if (whatsapp.length === 9) whatsapp = "17" + whatsapp;
            const excelFile = document.getElementById('lote-excel').files[0];
            const kmlFile = document.getElementById('lote-kml').files[0];
            if (!excelFile || !kmlFile || whatsapp.length < 11) return msgEl.innerText = "Dados incompletos.";
            
            msgEl.className = 'text-sm text-center p-3 rounded-lg bg-blue-900 text-blue-300';
            msgEl.innerText = "Processando..."; msgEl.classList.remove('hidden');

            try {
                let { data: cli } = await sb.from('clientes').select('id').eq('whatsapp', whatsapp).maybeSingle();
                let clienteId = cli ? cli.id : (await sb.from('clientes').insert({ nome: "Cliente " + whatsapp, whatsapp, ativo: true }).select('id').single()).data.id;

                msgEl.innerText = "Apagando talhões antigos...";
                await sb.from('talhoes').delete().eq('cliente_id', clienteId);

                const poligonosKml = await lerPoligonosDeKmlUnico(kmlFile);
                const dadosExcel = XLSX.utils.sheet_to_json(XLSX.read(await excelFile.arrayBuffer()).Sheets[Object.keys(XLSX.read(await excelFile.arrayBuffer()).Sheets)[0]]);
                let talhoesParaSalvar = [];

                msgEl.innerText = "Cruzando dados...";

                for (const linha of dadosExcel) {
                    const nomeTalhao = String(linha.talhao || "").trim();
                    const codigoBloco = String(linha.codigo_bloco || "").trim();
                    if (!nomeTalhao) continue;
                    const buscaComposta = normalizarNome(codigoBloco + "-" + nomeTalhao);
                    
                    const matchPoligono = poligonosKml.find(p => normalizarNome(p.nome).includes(buscaComposta));
                    if (!matchPoligono) continue;

                    const isNullOrEmpty = (val) => (val === undefined || val === null || val === "");
                    const parseNum = (val) => isNullOrEmpty(val) ? 0 : parseFloat(val);
                    const parseDate = (val) => {
                        if (isNullOrEmpty(val)) return null;
                        if (typeof val === 'number') { let d = new Date(Math.round((val - 25569) * 86400 * 1000)); return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`; }
                        return String(val).split(' ')[0];
                    };

                    talhoesParaSalvar.push({
                        id: crypto.randomUUID(), cliente_id: clienteId, codigo_talhao: nomeTalhao.substring(0, 20),
                        nome_fazenda: isNullOrEmpty(linha.nome_fazenda) ? 'N/D' : String(linha.nome_fazenda),
                        codigo_bloco: codigoBloco,
                        ambiente_producao: isNullOrEmpty(linha.ambiente_producao) ? 'N/D' : String(linha.ambiente_producao),
                        geom: matchPoligono.geom,
                        variedade: isNullOrEmpty(linha.variedade) ? 'N/D' : String(linha.variedade),
                        tipo_plantio: isNullOrEmpty(linha.tipo_plantio) ? 'Plantio' : String(linha.tipo_plantio),
                        numero_corte: isNullOrEmpty(linha.numero_corte) ? 1 : parseInt(linha.numero_corte),
                        data_plantio: parseDate(linha.data_plantio), data_ultimo_corte: parseDate(linha.data_ultimo_corte),
                        tch_planejado: parseNum(linha.tch_planejado), tch_realizado: parseNum(linha.tch_realizado),
                        atr_planejado: parseNum(linha.atr_planejado), atr_realizado: parseNum(linha.atr_realizado)
                    });
                }

                if (talhoesParaSalvar.length === 0) throw new Error("Nenhum desenho casou com o Excel.");
                msgEl.innerText = "Salvando " + talhoesParaSalvar.length + " talhões...";
                await sb.from('talhoes').insert(talhoesParaSalvar);
                msgEl.className = 'text-sm text-center p-3 rounded-lg bg-green-900 text-green-200';
                msgEl.innerHTML = `<b>SUCESSO! ${talhoesParaSalvar.length} talhões cadastrados.</b>`;
            } catch (e) { msgEl.className = 'text-sm text-center p-3 rounded-lg bg-red-900 text-red-300'; msgEl.innerText = "Erro: " + e.message; }
        }
    </script>
</body>
</html>
