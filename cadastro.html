    <script>
        const supabaseClient = window.supabase.createClient('https://keiydgyountsuzjybsng.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtlaXlkZ3lvdW50c3V6anlic25nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1ODY1MTksImV4cCI6MjA5ODE2MjUxOX0.Cd3TqUBZsNWV00AZGkrElJVmNlWPccDgtl-n95BVwjg');

        function switchTab(tab) {
            if (tab === 'manual') {
                document.getElementById('form-manual').classList.remove('hidden');
                document.getElementById('form-lote').classList.add('hidden');
                document.getElementById('tab-manual-btn').className = "tab-active flex-1 py-2 rounded-md font-bold transition";
                document.getElementById('tab-lote-btn').className = "tab-inactive flex-1 py-2 rounded-md font-bold transition";
            } else {
                document.getElementById('form-manual').classList.add('hidden');
                document.getElementById('form-lote').classList.remove('hidden');
                document.getElementById('tab-manual-btn').className = "tab-inactive flex-1 py-2 rounded-md font-bold transition";
                document.getElementById('tab-lote-btn').className = "tab-active flex-1 py-2 rounded-md font-bold transition";
            }
        }

        function baixarModelo() {
            const dados = [
                { talhao: "10", nome_fazenda: "São Jorge", codigo_bloco: "1010", variedade: "RB92579", tipo_plantio: "Plantio", numero_corte: 1, data_plantio: "2023-04-15", data_ultimo_corte: "", tch_planejado: 85.0, tch_realizado: 80.0, atr_planejado: 140, atr_realizado: 135 },
                { talhao: "11", nome_fazenda: "São Jorge", codigo_bloco: "1010", variedade: "CTC4", tipo_plantio: "Soca", numero_corte: 3, data_plantio: "", data_ultimo_corte: "2023-08-10", tch_planejado: 65.0, tch_realizado: 0, atr_planejado: 130, atr_realizado: 0 }
            ];
            const ws = XLSX.utils.json_to_sheet(dados);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Talhões");
            XLSX.writeFile(wb, "Modelo_Cadastro_Lote.xlsx");
        }

        function normalizarNome(str) {
            return String(str).replace(/\s+/g, '').toLowerCase();
        }

        // Lê UM ÚNICO arquivo KML/KMZ e extrai TODOS os polígonos (Placemarks) com seus nomes
        async function lerPoligonosDeKmlUnico(file) {
            let kmlText = '';
            if (file.name.toLowerCase().endsWith('.kmz')) {
                const zip = await JSZip.loadAsync(file);
                const kmlFile = Object.keys(zip.files).find(f => f.endsWith('.kml'));
                kmlText = await zip.files[kmlFile].async('string');
            } else {
                kmlText = await file.text();
            }

            const parser = new DOMParser();
            const kml = parser.parseFromString(kmlText, 'text/xml');
            const placemarks = kml.getElementsByTagName('Placemark');
            let poligonos = [];

            for (let i = 0; i < placemarks.length; i++) {
                const pm = placemarks[i];
                const nameEl = pm.getElementsByTagName('name')[0];
                const coordsEl = pm.getElementsByTagName('coordinates')[0];
                
                if (!nameEl || !coordsEl) continue;

                const nome = nameEl.textContent.trim();
                const coordsText = coordsEl.textContent.trim();
                const coordsArray = coordsText.split(/\s+/).map(coord => {
                    const parts = coord.split(',');
                    const lon = parseFloat(parts[0]);
                    const lat = parseFloat(parts[1]);
                    return [lon, lat];
                });

                if (coordsArray.length > 0 && coordsArray[0][0] !== coordsArray[coordsArray.length-1][0]) {
                    coordsArray.push(coordsArray[0]);
                }

                poligonos.push({
                    nome: nome,
                    geom: { "type": "Polygon", "coordinates": [coordsArray] }
                });
            }
            return poligonos;
        }

        async function lerArquivoUnico(file) {
            let kmlText = '';
            if (file.name.endsWith('.kmz')) {
                const zip = await JSZip.loadAsync(file);
                const kmlFile = Object.keys(zip.files).find(f => f.endsWith('.kml'));
                kmlText = await zip.files[kmlFile].async('string');
            } else { kmlText = await file.text(); }
            
            const parser = new DOMParser();
            const kml = parser.parseFromString(kmlText, 'text/xml');
            const coordsEl = kml.getElementsByTagName('coordinates')[0];
            if (!coordsEl) return null;
            const coordsText = coordsEl.textContent.trim();
            const coordsArray = coordsText.split(/\s+/).map(coord => {
                const [lon, lat] = coord.split(',').map(Number);
                return [lon, lat];
            });
            if (coordsArray[0][0] !== coordsArray[coordsArray.length-1][0]) { coordsArray.push(coordsArray[0]); }
            return { "type": "Polygon", "coordinates": [coordsArray] };
        }

        async function enviarManual() {
            const msgEl = document.getElementById('statusManual');
            let whatsapp = document.getElementById('manual-whatsapp').value.replace(/\D/g, '');
            if (whatsapp.length === 9) whatsapp = "17" + whatsapp;
            const file = document.getElementById('manual-arquivo').files[0];
            
            if (!file || whatsapp.length < 11) {
                msgEl.className = 'text-sm text-center p-3 rounded-lg bg-red-900 text-red-300';
                msgEl.innerText = "Preencha WhatsApp e selecione o arquivo.";
                msgEl.classList.remove('hidden');
                return;
            }

            msgEl.className = 'text-sm text-center p-3 rounded-lg bg-blue-900 text-blue-300';
            msgEl.innerText = "Lendo desenho e cadastrando...";
            msgEl.classList.remove('hidden');

            try {
                let { data: cli } = await supabaseClient.from('clientes').select('id').eq('whatsapp', whatsapp).maybeSingle();
                let clienteId;
                if (cli) { clienteId = cli.id; } 
                else {
                    const { data: novoCli, error: errC } = await supabaseClient.from('clientes').insert({ nome: "Cliente " + whatsapp, whatsapp: whatsapp, ativo: true }).select('id').single();
                    if(errC) throw errC; clienteId = novoCli.id;
                }

                const geom = await lerArquivoUnico(file);
                if (!geom) throw new Error("Erro ao ler o KML/KMZ.");

                const parseDate = (id) => { const v = document.getElementById(id).value; return v ? v.split(' ')[0] : null; };
                const parseNum = (id) => { const v = document.getElementById(id).value; return v ? parseFloat(v) : 0; };

                const { error: errT } = await supabaseClient.from('talhoes').insert({
                    id: crypto.randomUUID(),
                    cliente_id: clienteId,
                    codigo_talhao: document.getElementById('manual-nome').value.substring(0, 20),
                    nome_fazenda: document.getElementById('manual-fazenda').value || 'Não Informada',
                    codigo_bloco: document.getElementById('manual-bloco').value || '',
                    geom: geom,
                    variedade: document.getElementById('manual-variedade').value || 'Não Informada',
                    tipo_plantio: document.getElementById('manual-tipo').value,
                    numero_corte: parseInt(document.getElementById('manual-corte').value),
                    data_plantio: parseDate('manual-data-pl'),
                    data_ultimo_corte: parseDate('manual-data-ct'),
                    tch_planejado: parseNum('manual-tch-pl'),
                    tch_realizado: parseNum('manual-tch-re'),
                    atr_planejado: 0,
                    atr_realizado: 0
                });

                if (errT) throw errT;
                msgEl.className = 'text-sm text-center p-3 rounded-lg bg-green-900 text-green-200';
                msgEl.innerHTML = `<b>SUCESSO! Talhão cadastrado.</b><br>Rode o Python nas Actions para gerar a imagem.`;
            } catch (error) {
                msgEl.className = 'text-sm text-center p-3 rounded-lg bg-red-900 text-red-300';
                msgEl.innerText = "Erro: " + error.message;
            }
        }

        async function enviarLote() {
            const msgEl = document.getElementById('statusLote');
            let whatsapp = document.getElementById('lote-whatsapp').value.replace(/\D/g, '');
            if (whatsapp.length === 9) whatsapp = "17" + whatsapp;
            const excelFile = document.getElementById('lote-excel').files[0];
            const kmlFile = document.getElementById('lote-kml').files[0];

            if (!excelFile || !kmlFile || whatsapp.length < 11) {
                msgEl.className = 'text-sm text-center p-3 rounded-lg bg-red-900 text-red-300';
                msgEl.innerText = "Preencha o WhatsApp e selecione o Excel e o KML.";
                msgEl.classList.remove('hidden');
                return;
            }

            msgEl.className = 'text-sm text-center p-3 rounded-lg bg-blue-900 text-blue-300';
            msgEl.innerText = "Lendo arquivos... Pode levar 1 minuto.";
            msgEl.classList.remove('hidden');

            try {
                const { data: cli } = await supabaseClient.from('clientes').select('id').eq('whatsapp', whatsapp).maybeSingle();
                let clienteId;
                if (cli) { clienteId = cli.id; } 
                else {
                    const { data: novoCli, error: errC } = await supabaseClient.from('clientes').insert({ nome: "Cliente " + whatsapp, whatsapp: whatsapp, ativo: true }).select('id').single();
                    if(errC) throw errC; clienteId = novoCli.id;
                }

                msgEl.innerText = "Extraindo polígonos do KML/KMZ...";
                const poligonosKml = await lerPoligonosDeKmlUnico(kmlFile);

                const excelData = await excelFile.arrayBuffer();
                const workbook = XLSX.read(excelData);
                const dadosExcel = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                
                let talhoesParaSalvar = [];
                msgEl.innerText = "Cruzando dados do Excel com os desenhos...";

                for (const linha of dadosExcel) {
                    const nomeTalhao = String(linha.talhao || "").trim();
                    const codigoBloco = String(linha.codigo_bloco || "").trim();
                    if (!nomeTalhao) continue;

                    const buscaComposta = normalizarNome(codigoBloco + "-" + nomeTalhao);
                    const buscaTalhao = normalizarNome(nomeTalhao);

                    // Procura o polígono dentro do KML que case com o Bloco-Talhão do Excel
                    const matchPoligono = poligonosKml.find(p => {
                        const nomeLimpo = normalizarNome(p.nome);
                        if (codigoBloco) {
                            return nomeLimpo.includes(buscaComposta);
                        } else {
                            return nomeLimpo.includes(buscaTalhao);
                        }
                    });

                    if (!matchPoligono) { 
                        console.warn("Desenho não encontrado no KML para o talhão: Bloco " + codigoBloco + " Talhão " + nomeTalhao);
                        continue; 
                    }

                    const isNullOrEmpty = (val) => (val === undefined || val === null || val === "");
                    const parseNum = (val) => isNullOrEmpty(val) ? 0 : parseFloat(val);
                    
                    // NOVA LÓGICA DE DATA QUE LÊ NÚMEROS DO EXCEL
                    const parseDate = (val) => {
                        if (isNullOrEmpty(val)) return null;
                        if (typeof val === 'number') {
                            let date = new Date(Math.round((val - 25569) * 86400 * 1000));
                            let y = date.getUTCFullYear();
                            let m = String(date.getUTCMonth() + 1).padStart(2, '0');
                            let d = String(date.getUTCDate()).padStart(2, '0');
                            return `${y}-${m}-${d}`;
                        }
                        let str = String(val);
                        if (/^\d{4}-\d{2}-\d{2}/.test(str)) return str.split(' ')[0];
                        if (str instanceof Date) {
                            let y = str.getUTCFullYear();
                            let m = String(str.getUTCMonth() + 1).padStart(2, '0');
                            let d = String(str.getUTCDate()).padStart(2, '0');
                            return `${y}-${m}-${d}`;
                        }
                        return str.split(' ')[0];
                    };

                    talhoesParaSalvar.push({
                        id: crypto.randomUUID(),
                        cliente_id: clienteId,
                        codigo_talhao: nomeTalhao.substring(0, 20),
                        nome_fazenda: isNullOrEmpty(linha.nome_fazenda) ? 'Não Informada' : String(linha.nome_fazenda),
                        codigo_bloco: codigoBloco,
                        geom: matchPoligono.geom,
                        variedade: isNullOrEmpty(linha.variedade) ? 'Não Informada' : String(linha.variedade),
                        tipo_plantio: isNullOrEmpty(linha.tipo_plantio) ? 'Plantio' : String(linha.tipo_plantio),
                        numero_corte: isNullOrEmpty(linha.numero_corte) ? 1 : parseInt(linha.numero_corte),
                        data_plantio: parseDate(linha.data_plantio),
                        data_ultimo_corte: parseDate(linha.data_ultimo_corte),
                        tch_planejado: parseNum(linha.tch_planejado),
                        tch_realizado: parseNum(linha.tch_realizado),
                        atr_planejado: parseNum(linha.atr_planejado),
                        atr_realizado: parseNum(linha.atr_realizado)
                    });
                }

                if (talhoesParaSalvar.length === 0) throw new Error("Nenhum desenho do KML casou com os dados do Excel. Verifique se os nomes dos talhões no Google Earth contêm o Bloco e o Talhão (ex: 1010-10).");
                
                msgEl.innerText = "Salvando " + talhoesParaSalvar.length + " talhões no banco...";
                const { error: errInsert } = await supabaseClient.from('talhoes').insert(talhoesParaSalvar);
                if (errInsert) throw errInsert;

                msgEl.className = 'text-sm text-center p-3 rounded-lg bg-green-900 text-green-200';
                msgEl.innerHTML = `<b>SUCESSO! ${talhoesParaSalvar.length} talhões cadastrados.</b>`;
            } catch (error) {
                msgEl.className = 'text-sm text-center p-3 rounded-lg bg-red-900 text-red-300';
                msgEl.innerText = "Erro: " + error.message;
            }
        }
    </script>
