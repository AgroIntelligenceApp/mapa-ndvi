<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agro Intelligence | Módulo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        html, body { height: 100%; margin: 0; }
        .iframe-container { flex: 1; overflow: hidden; }
        .iframe-container iframe { width: 100%; height: 100%; border: none; }
        .menu-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: all 0.2s; text-decoration: none; }
        .menu-item:hover { background-color: #f0f0f0; }
        .menu-item.active { background-color: #2d8659; color: white; }
        .menu-category-title { font-size: 11px; text-transform: uppercase; color: #6b7280; margin-top: 15px; margin-bottom: 5px; padding-left: 5px; }

        /* CSS PARA IMPRESSÃO (PDF) */
        @media print {
            body { background: white !important; height: auto !important; overflow: visible !important; }
            header, aside, button { display: none !important; } /* Esconde menu e botões */
            .flex-1 { display: block !important; }
            .iframe-container { height: 100vh !important; overflow: visible !important; }
            iframe { height: 100% !important; width: 100% !important; }
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col">
    
    <header class="bg-[#1a472a] text-white p-4 flex justify-between items-center shadow-md flex-shrink-0 z-20">
        <button onclick="toggleSidebar()" class="hover:bg-white/10 p-2 rounded">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
        </button>
        <div class="flex items-center gap-2">
            <img src="logo.png" alt="Logo" class="h-8 w-8 object-contain" onerror="this.style.display='none'">
            <h1 class="text-lg font-bold" id="titulo-modulo">Carregando...</h1>
        </div>
        <!-- BOTÃO EXPORTAR PDF -->
        <button onclick="window.print()" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-lg flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
            Exportar PDF
        </button>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="w-64 bg-white border-r border-gray-200 flex flex-col overflow-y-auto transition-all duration-300 md:translate-x-0 -translate-x-full fixed md:relative h-full z-10">
            <div class="p-4">
                <div class="border-b pb-2 mb-2"><h2 class="text-md font-bold text-gray-800" id="nome-cliente">Carregando...</h2></div>
                <div class="menu-category-title">Principal</div>
                <a href="dashboard.html" class="menu-item">🏠 Visão Geral</a>
                <a href="index.html?view=map&mode=limites" class="menu-item">🗺️ Mapas</a>
                <div class="menu-category-title">Agronômico</div>
                <div id="menu-dev" class="menu-item" onclick="window.location.href='modulo.html?tipo=agronomico'">🌱 Desenvolvimento</div>
                <div id="menu-pragas" class="menu-item" onclick="window.location.href='modulo.html?tipo=pragas'">🐛 Pragas & Doenças</div>
                <div id="menu-solo" class="menu-item" onclick="window.location.href='modulo.html?tipo=solo'">🧪 Análise de Solo</div>
                <div id="menu-qualidade" class="menu-item" onclick="window.location.href='modulo.html?tipo=qualidade'">📈 Qualidade</div>
                <div class="menu-category-title">Monitoramento</div>
                <a href="index.html?view=map&mode=ndvi" class="menu-item">🛰️ NDVI</a>
                <a href="chuvas.html" class="menu-item">🌧️ Clima & Chuva</a>
                <a href="kpi.html" class="menu-item">📊 Indicadores</a>
                <div class="menu-category-title">Sistema</div>
                <a href="configuracoes.html" class="menu-item">⚙️ Configurações</a>
            </div>
        </aside>

        <div class="flex-1 flex flex-col">
            <div id="status" class="text-gray-500 text-center p-4 flex-1 flex items-center justify-center">Carregando relatório...</div>
            
            <div id="iframe-container" class="iframe-container hidden">
                <iframe id="iframe-modulo" title="Relatório Agro Intelligence" allowFullScreen="true"></iframe>
            </div>
        </div>
    </div>

    <script>
        const sb = supabase.createClient('https://keiydgyountsuzjybsng.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtlaXlkZ3lvdW50c3V6anlic25nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1ODY1MTksImV4cCI6MjA5ODE2MjUxOX0.Cd3TqUBZsNWV00AZGkrElJVmNlWPccDgtl-n95BVwjg');

        window.onload = async () => {
            const statusEl = document.getElementById('status');
            const iframeCont = document.getElementById('iframe-container');
            const iframe = document.getElementById('iframe-modulo');

            try {
                const { data: { session } } = await sb.auth.getSession();
                if (!session) return window.location.href = 'index.html';
                const whatsapp = session.user.email.replace('@app.ndvi', '');
                
                const urlParams = new URLSearchParams(window.location.search);
                const tipo = urlParams.get('tipo');
                
                const titulos = { 'qualidade': 'Qualidade', 'pragas': 'Controle de Pragas', 'agronomico': 'Desenvolvimento Agronômico', 'solo': 'Análise de Solo' };
                document.getElementById('titulo-modulo').innerText = titulos[tipo] || 'Módulo';

                const menuAtivo = document.getElementById('menu-' + tipo);
                if (menuAtivo) menuAtivo.classList.add('active');

                if (!tipo) { statusEl.innerText = 'Módulo não especificado.'; return; }

                let cliId = null;
                let nomeUsuario = "Cliente";
                let { data: usuario } = await sb.from('usuarios').select('cliente_id, nome').eq('whatsapp', whatsapp).maybeSingle();
                if (usuario) { cliId = usuario.cliente_id; nomeUsuario = usuario.nome; } 
                else {
                    let { data: cli } = await sb.from('clientes').select('id, nome').eq('whatsapp', whatsapp).maybeSingle();
                    if (cli) { cliId = cli.id; nomeUsuario = cli.nome; }
                }

                if (!cliId) { await sb.auth.signOut(); window.location.href = 'index.html'; return; }

                const { data: cliData } = await sb.from('clientes').select('nome').eq('id', cliId).single();
                if (cliData) document.getElementById('nome-cliente').innerText = cliData.nome || "Cliente";

                const colMod = `mod_${tipo}`;
                const colLink = `link_${tipo}`;
                const { data: cli, error } = await sb.from('clientes').select(`${colMod}, ${colLink}`).eq('id', cliId).single();
                
                if (error) throw error;

                if (cli[colMod] === true && cli[colLink]) {
                    iframe.src = cli[colLink];
                    iframeCont.classList.remove('hidden');
                    statusEl.classList.add('hidden');
                } else if (cli[colMod] === true && !cli[colLink]) {
                    statusEl.innerText = 'Relatório em elaboração pela nossa equipe técnica.';
                } else {
                    statusEl.innerText = 'Módulo bloqueado. Contate o suporte para liberar.';
                }
            } catch (e) {
                statusEl.innerText = 'Erro ao carregar: ' + e.message;
            }
        };

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); }
    </script>
</body>
</html>
