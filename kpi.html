<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro Intelligence | KPI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <header class="bg-[#1a472a] text-white p-4 flex justify-between items-center shadow-md z-10">
        <a href="dashboard.html" style="text-decoration: none; color: white; font-size: 14px; font-weight: bold;">← Painel</a>
        <div class="flex items-center gap-2">
            <img src="logo.png" alt="Logo" class="h-8 w-8 object-contain" onerror="this.style.display='none'">
            <h1 class="text-lg font-bold">Agro Intelligence</h1>
        </div>
        <div style="width: 50px;"></div>
    </header>

    <main class="flex-1 p-4 md:p-8 w-full max-w-6xl mx-auto">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">📊 Visão Geral da Fazenda</h2>
        <div id="status-kpi" class="text-gray-500 text-center p-4">Carregando...</div>
        <div id="conteudo-kpi" class="hidden flex flex-col gap-6">
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-[#1a472a] text-white rounded-xl shadow-lg p-6 text-center">
                    <p class="text-sm uppercase opacity-80">Área Total</p>
                    <p id="total-geral" class="text-3xl font-bold mt-2">0</p>
                </div>
                <div class="bg-white border rounded-xl shadow-lg p-6 text-center">
                    <p class="text-sm text-gray-500">Área Plantio</p>
                    <p id="total-plantio" class="text-3xl font-bold text-blue-600 mt-2">0</p>
                </div>
                <div class="bg-white border rounded-xl shadow-lg p-6 text-center">
                    <p class="text-sm text-gray-500">Área Soca</p>
                    <p id="total-soca" class="text-3xl font-bold text-green-600 mt-2">0</p>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <div class="bg-white rounded-xl shadow-lg p-6 border">
                    <h3 class="text-md font-bold text-gray-700 mb-4">Indicador de Maturação</h3>
                    <table class="w-full text-left"><thead><tr class="border-b"><th class="py-2 text-xs">Tipo</th><th class="py-2 text-xs text-right">Área</th></tr></thead><tbody id="tabela-maturacao" class="divide-y"></tbody></table>
                </div>
                <div class="bg-white rounded-xl shadow-lg p-6 border">
                    <h3 class="text-md font-bold text-gray-700 mb-4">Ambientes</h3>
                    <table class="w-full text-left"><thead><tr class="border-b"><th class="py-2 text-xs">Ambiente</th><th class="py-2 text-xs text-right">Área</th></tr></thead><tbody id="tabela-ambientes" class="divide-y"></tbody></table>
                </div>
                <div class="bg-white rounded-xl shadow-lg p-6 border">
                    <h3 class="text-md font-bold text-gray-700 mb-4">Variedades</h3>
                    <table class="w-full text-left"><thead><tr class="border-b"><th class="py-2 text-xs">Variedade</th><th class="py-2 text-xs text-right">Área</th></tr></thead><tbody id="tabela-variedades" class="divide-y"></tbody></table>
                </div>
                <div class="bg-white rounded-xl shadow-lg p-6 border">
                    <h3 class="text-md font-bold text-gray-700 mb-4">Corte e Idade</h3>
                    <table class="w-full text-left"><thead><tr class="border-b"><th class="py-2 text-xs">Corte</th><th class="py-2 text-xs text-right">Área</th><th class="py-2 text-xs text-right">Idade</th></tr></thead><tbody id="tabela-cortes" class="divide-y"></tbody></table>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-lg p-6 border border-gray-100 mt-4">
                <h3 class="text-lg font-bold text-gray-700 mb-4 text-center">📂 Módulos de Análise Premium</h3>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="modulos-container"></div>
            </div>

            <div id="container-modulo-iframe" class="w-full overflow-hidden rounded-lg border border-gray-200 hidden" style="height: 600px;">
                <iframe id="iframe-modulo" title="Módulo Agro Intelligence" width="100%" height="100%" frameborder="0" allowFullScreen="true"></iframe>
            </div>

        </div>
    </main>

    <script>
        const sb = supabase.createClient('https://keiydgyountsuzjybsng.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtlaXlkZ3lvdW50c3V6anlic25nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1ODY1MTksImV4cCI6MjA5ODE2MjUxOX0.Cd3TqUBZsNWV00AZGkrElJVmNlWPccDgtl-n95BVwjg');

        function formatBR(num, dec = 2) { return num.toLocaleString('pt-BR', { minimumFractionDigits: dec, maximumFractionDigits: dec }); }
        function calcArea(geojson) { let a=0;const c=geojson.coordinates[0];const R=6378137;for(let i=0;i<c.length;i++){const[l1,w1]=c[i];const[l2,w2]=c[(i+1)%c.length];a+=((l2-l1)*Math.PI/180)*(2+Math.sin(w1*Math.PI/180)+Math.sin(w2*Math.PI/180));}return Math.abs(a*R*R/2)/10000;}
        function calcIdade(d){if(!d)return "N/D";const diff=(new Date()-new Date(d+"T00:00:00"))/(1000*60*60*24*30.44);return isNaN(diff)?"N/D":Math.floor(diff)+"m";}

        let modulos = [];

        window.onload = async () => {
            const statusEl = document.getElementById('status-kpi');
            try {
                const { data: { session } } = await sb.auth.getSession();
                if (!session) return window.location.href = 'index.html';
                const whatsapp = session.user.email.replace('@app.ndvi', '');
                
                const { data: cli, error: errCli } = await sb.from('clientes').select('id, mod_qualidade, link_qualidade, mod_pragas, link_pragas, mod_agronomico, link_agronomico, mod_solo, link_solo').eq('whatsapp', whatsapp).single();
                if (errCli) throw errCli;
                if (!cli) throw new Error("Cliente não encontrado");

                modulos = [
                    { id: 'qualidade', nome: 'Qualidade Agrícola', ativo: cli.mod_qualidade, link: cli.link_qualidade, icon: '✅' },
                    { id: 'pragas', nome: 'Controle de Pragas', ativo: cli.mod_pragas, link: cli.link_pragas, icon: '🐛' },
                    { id: 'agronomico', nome: 'Desenvolvimento Agronômico', ativo: cli.mod_agronomico, link: cli.link_agronomico, icon: '🌱' },
                    { id: 'solo', nome: 'Análises de Solo', ativo: cli.mod_solo, link: cli.link_solo, icon: '🧪' }
                ];

                renderizarModulos();

                const { data: talhoes, error: errT } = await sb.from('talhoes').select('geom, area_hectares, tipo_plantio, numero_corte, variedade, maturacao, ambiente_producao, data_plantio, data_ultimo_corte').eq('cliente_id', cli.id);
                if (errT) throw errT;

                if (talhoes) {
                    let tg=0, tp=0, ts=0;
                    let mat={}, amb={}, vArr={}, cor={}; // Corrigido: var para vArr
                    
                    talhoes.forEach(t => {
                        let area = t.area_hectares || (t.geom ? calcArea(typeof t.geom === 'string' ? JSON.parse(t.geom) : t.geom) : 0);
                        if (!area) return;
                        tg += area;
                        if (t.tipo_plantio === 'Plantio') tp += area; else ts += area;
                        
                        let mk = t.maturacao || 'N/D'; if (!mat[mk]) mat[mk] = 0; mat[mk] += area;
                        let ak = t.ambiente_producao || 'N/D'; if (!amb[ak]) amb[ak] = 0; amb[ak] += area;
                        let vk = t.variedade || 'N/D'; if (!vArr[vk]) vArr[vk] = 0; vArr[vk] += area; // Corrigido
                        
                        let ck = `${t.numero_corte || 1}º Corte`; 
                        if (!cor[ck]) cor[ck] = { area: 0, iSoma: 0, count: 0 }; 
                        cor[ck].area += area;
                        let id = calcIdade(t.tipo_plantio === 'Plantio' ? t.data_plantio : t.data_ultimo_corte);
                        if (id !== "N/D") { cor[ck].iSoma += parseInt(id); cor[ck].count++; }
                    });

                    document.getElementById('total-geral').innerText = formatBR(tg) + " ha";
                    document.getElementById('total-plantio').innerText = formatBR(tp) + " ha";
                    document.getElementById('total-soca').innerText = formatBR(ts) + " ha";
                    
                    let h = ''; for (let k in mat) h += `<tr><td class="py-2 text-xs">${k}</td><td class="py-2 text-xs text-right">${formatBR(mat[k])}</td></tr>`; document.getElementById('tabela-maturacao').innerHTML = h;
                    h = ''; for (let k in amb) h += `<tr><td class="py-2 text-xs">${k}</td><td class="py-2 text-xs text-right">${formatBR(amb[k])}</td></tr>`; document.getElementById('tabela-ambientes').innerHTML = h;
                    h = ''; for (let k in vArr) h += `<tr><td class="py-2 text-xs">${k}</td><td class="py-2 text-xs text-right">${formatBR(vArr[k])}</td></tr>`; document.getElementById('tabela-variedades').innerHTML = h; // Corrigido
                    h = ''; for (let k in cor) { let o = cor[k]; let id = o.count > 0 ? Math.round(o.iSoma / o.count) + "m" : "N/D"; h += `<tr><td class="py-2 text-xs">${k}</td><td class="py-2 text-xs text-right">${formatBR(o.area)}</td><td class="py-2 text-xs text-right">${id}</td></tr>`; } document.getElementById('tabela-cortes').innerHTML = h;
                    
                    document.getElementById('status-kpi').classList.add('hidden');
                    document.getElementById('conteudo-kpi').classList.remove('hidden');
                }
            } catch (e) {
                statusEl.innerText = "Erro ao carregar dados: " + e.message;
                statusEl.className = "text-red-500 text-center p-4";
            }
        };

        function renderizarModulos() {
            const cont = document.getElementById('modulos-container');
            cont.innerHTML = '';
            modulos.forEach(m => {
                const cardClass = m.ativo ? 'bg-white border-green-500 cursor-pointer hover:shadow-lg' : 'bg-gray-100 border-gray-300 cursor-not-allowed opacity-60';
                const lockIcon = m.ativo ? '' : '🔒';
                cont.innerHTML += `
                    <div class="${cardClass} border-2 rounded-xl p-4 text-center transition-all" onclick="abrirModulo('${m.id}')">
                        <div class="text-3xl mb-2">${m.icon} <span class="text-sm">${lockIcon}</span></div>
                        <h4 class="text-sm font-bold text-gray-700">${m.nome}</h4>
                        ${!m.ativo ? '<p class="text-xs text-red-500 mt-1 font-bold">Bloqueado</p><p class="text-[10px] text-gray-500">Contate o suporte</p>' : '<p class="text-xs text-green-600 mt-1 font-bold">Liberado</p>'}
                    </div>
                `;
            });
        }

        window.abrirModulo = (id) => {
            const mod = modulos.find(m => m.id === id);
            if (!mod.ativo) {
                alert('Módulo Bloqueado! Contate o suporte da Agro Intelligence para contratar este serviço.');
                return;
            }
            if (!mod.link) {
                alert('Relatório em elaboração pela nossa equipe técnica.');
                return;
            }
            document.getElementById('iframe-modulo').src = mod.link;
            document.getElementById('container-modulo-iframe').classList.remove('hidden');
            document.getElementById('container-modulo-iframe').scrollIntoView({ behavior: 'smooth' });
        };
    </script>
</body>
</html>
