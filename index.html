<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agro Intelligence | Mapa NDVI</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f8; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

        /* TELA DE LOGIN */
        #tela-login { flex: 1; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #1a472a 0%, #2d8659 100%); }
        .login-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 90%; max-width: 400px; text-align: center; }
        .logo-img { width: 80px; height: 80px; object-fit: contain; margin: 0 auto 15px auto; display: block; }
        .login-box h2 { color: #1a472a; margin-bottom: 5px; font-size: 24px; display: block; }
        .login-box .subtitulo { color: #555; font-size: 16px; margin-bottom: 20px; font-weight: bold; display: block; }
        .login-box input { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        .login-box button { width: 100%; padding: 15px; background: #2d8659; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .login-box button:hover { background: #1a472a; }
        .login-box a { color: #25D366; text-decoration: none; font-weight: bold; }
        #msg-erro-login { color: red; margin-top: 15px; font-size: 14px; min-height: 20px; }
        .dica-login { font-size: 12px; color: #888; margin-top: -5px; text-align: left; width: 100%; }

        /* TELA DO APP */
        #tela-app { display: none; flex: 1; flex-direction: column; height: 100vh; height: 100dvh; }
        .header { background: #1a472a; color: white; padding: 10px 20px; display: flex; justify-content: center; align-items: center; z-index: 1000; position: relative; text-align: center; }
        .header-titulos h1 { font-size: 18px; line-height: 1.2; display: block; }
        .header-titulos p { font-size: 12px; opacity: 0.8; line-height: 1.2; display: block; }
        .btn-logout { background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; position: absolute; right: 15px; top: 50%; transform: translateY(-50%); }

        .corpo { display: flex; flex: 1; overflow: hidden; position: relative; }
        .painel-lateral { width: 320px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; z-index: 900; transition: transform 0.3s ease; }
        .busca-container { padding: 15px; border-bottom: 1px solid #ddd; }
        .busca-container input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        
        .botoes-acoes { padding: 10px 15px; display: flex; gap: 10px; border-bottom: 1px solid #ddd; flex-wrap: wrap; }
        .botoes-acoes button { flex: 1; padding: 8px; border: 1px solid #ccc; background: #f8f9fa; border-radius: 5px; cursor: pointer; font-size: 13px; }
        .btn-analisar { background: #1a472a !important; color: white !important; font-weight: bold; border: none !important; width: 100% !important; }
        
        .container-cultura { padding: 10px 15px; border-bottom: 1px solid #ddd; }
        .container-cultura select { width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #ccc; font-size: 14px; cursor: pointer; }
        
        #lista-talhoes { flex: 1; overflow-y: auto; padding: 10px; }
        .item-talhao { padding: 12px; border-bottom: 1px solid #eee; display: flex; align-items: center; border-radius: 5px; cursor: pointer; }
        .item-talhao:active { background-color: #f0f0f0; }
        .item-talhao label { margin-left: 10px; cursor: pointer; font-size: 15px; user-select: none; }

        .btn-flutuante { display: none; position: absolute; top: 10px; left: 10px; z-index: 1100; background: #1a472a; color: white; border: none; width: 45px; height: 45px; border-radius: 50%; font-size: 24px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); align-items: center; justify-content: center; }
        #mapa { flex: 1; background: #e9e9e9; position: relative; }
        
        /* BARRA INFERIOR ORIGINAL (DATA) */
        #barra-data { background: #333; color: white; text-align: center; padding: 10px; font-size: 13px; z-index: 1000; }

        /* NOVO PAINEL FLUTUANTE DE ANÁLISE */
        #painel-analise {
            position: absolute; bottom: 20px; right: 10px; z-index: 1000; background: rgba(26, 71, 42, 0.95);
            color: white; padding: 15px; border-radius: 8px; font-size: 12px; width: 220px;
            display: none; box-shadow: 0 4px 8px rgba(0,0,0,0.4); line-height: 1.4;
        }
        #painel-analise.show { display: block; }
        #painel-analise .btn-fechar { position: absolute; top: 5px; right: 8px; color: #aaa; cursor: pointer; font-weight: bold; }
        
        /* ESTILO DA LEGENDA DE CORES */
        .linha-legenda { display: flex; align-items: center; margin-bottom: 4px; }
        .cor-quadrado { width: 12px; height: 12px; margin-right: 8px; border: 1px solid rgba(255,255,255,0.3); border-radius: 2px; }
        .titulo-painel { font-weight: bold; margin-bottom: 8px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 5px; }

        @media (max-width: 768px) {
            .btn-flutuante { display: flex; }
            .painel-lateral { position: absolute; top: 0; left: 0; height: 100%; width: 85%; max-width: 320px; box-shadow: 2px 0 10px rgba(0,0,0,0.3); transform: translateX(-100%); }
            .painel-lateral.aberto { transform: translateX(0); }
            .overlay-mobile { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 800; }
            .overlay-mobile.visivel { display: block; }
        }
    </style>
</head>
<body>

    <div id="tela-login">
        <div class="login-box">
            <img src="logo.png" alt="Agro Intelligence" class="logo-img" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='flex';">
            <div id="logo-fallback" class="w-16 h-16 bg-green-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl font-bold" style="display: none; width: 64px; height: 64px;">A</div>
            <h2>Agro Intelligence</h2>
            <p class="subtitulo">Mapa NDVI</p>
            <input type="text" id="campo-whatsapp" placeholder="Seu WhatsApp (ex: 17997927252)" maxlength="15">
            <p class="dica-login">Dica: Digite DDD + Número (11 dígitos).</p>
            <button onclick="fazerLogin()">Entrar</button>
            <div id="msg-erro-login"></div>
            <p style="margin-top: 20px; font-size: 14px; color: #666;">
                Esqueceu sua senha ou precisa de acesso?<br>
                <a href="https://wa.me/5517997927252?text=Olá, preciso de ajuda com meu acesso ao Mapa NDVI." target="_blank">Fale com o Suporte</a>
            </p>
        </div>
    </div>

    <div id="tela-app">
        <div class="header">
            <div class="header-titulos">
                <h1>Agro Intelligence</h1>
                <p>Mapa NDVI</p>
            </div>
            <button class="btn-logout" onclick="deslogar()">Sair</button>
        </div>
        <div class="corpo">
            <div class="overlay-mobile" id="overlay-mobile" onclick="fecharListaMobile()"></div>
            <button class="btn-flutuante" id="btn-flutuante" onclick="abrirListaMobile()">☰</button>
            
            <div class="painel-lateral" id="painel-lateral">
                <div class="busca-container">
                    <input type="text" id="campo-busca" placeholder="Buscar talhão (ex: 70010)" oninput="filtrarLista()">
                </div>
                <div class="container-cultura">
                    <select id="select-cultura">
                        <option value="cana">Cana-de-açúcar (TCH)</option>
                        <option value="soja">Soja (Sc/ha)</option>
                        <option value="milho">Milho (Sc/ha)</option>
                    </select>
                </div>
                <div class="botoes-acoes">
                    <button onclick="marcarTodos()">Marcar Todos</button>
                    <button onclick="desmarcarTodos()">Desmarcar Todos</button>
                    <button onclick="analisarSelecao()" class="btn-analisar">Analisar Biomassa</button>
                </div>
                <div id="lista-talhoes"></div>
            </div>

            <div id="mapa">
                <div id="painel-analise">
                    <span class="btn-fechar" onclick="document.getElementById('painel-analise').classList.remove('show')">X</span>
                    <div id="conteudo-analise">Processando...</div>
                </div>
            </div>
        </div>
        <div id="barra-data">Selecione talhões e aguarde...</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const supabaseUrl = 'https://keiydgyountsuzjybsng.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtlaXlkZ3lvdW50c3V6anlic25nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1ODY1MTksImV4cCI6MjA5ODE2MjUxOX0.Cd3TqUBZsNWV00AZGkrElJVmNlWPccDgtl-n95BVwjg';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let mapa = null;
        let dadosTalhoes = [];
        let clienteId = null;
        let isMobile = window.innerWidth <= 768;

        function abrirListaMobile() { document.getElementById('painel-lateral').classList.add('aberto'); document.getElementById('overlay-mobile').classList.add('visivel'); }
        function fecharListaMobile() { document.getElementById('painel-lateral').classList.remove('aberto'); document.getElementById('overlay-mobile').classList.remove('visivel'); }

        window.onload = async () => {
            window.addEventListener('resize', () => { isMobile = window.innerWidth <= 768; });
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) { const whatsapp = session.user.email.replace('@app.ndvi', ''); await validarAcessoELoadar(whatsapp); } else { mostrarTela('login'); }
        };

        function mostrarTela(tela) {
            document.getElementById('tela-login').style.display = tela === 'login' ? 'flex' : 'none';
            document.getElementById('tela-app').style.display = tela === 'app' ? 'flex' : 'none';
        }

        function padronizarWhatsapp(numero) { let num = numero.replace(/\D/g, ''); if (num.length === 9) num = "17" + num; return num; }

        async function fazerLogin() {
            const msgErro = document.getElementById('msg-erro-login');
            const whatsappFormatado = padronizarWhatsapp(document.getElementById('campo-whatsapp').value);
            if (whatsappFormatado.length < 11) { msgErro.innerText = "Digite um número válido (DDD + Número)."; msgErro.style.color = "red"; return; }
            msgErro.innerText = "Verificando..."; msgErro.style.color = "#666";
            const emailFake = whatsappFormatado + "@app.ndvi"; const senha = whatsappFormatado; 
            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email: emailFake, password: senha });
                if (error) throw error;
                await validarAcessoELoadar(whatsappFormatado);
            } catch (error) {
                msgErro.style.color = "red";
                msgErro.innerText = error.message.includes("Invalid login") ? "Usuário ou senha incorretos." : "Erro: " + error.message;
            }
        }

        async function validarAcessoELoadar(whatsapp) {
            const msgErro = document.getElementById('msg-erro-login');
            const { data: cliente, error: dbError } = await supabaseClient.from('clientes').select('id, ativo').eq('whatsapp', whatsapp).single();
            if (dbError || !cliente) { await supabaseClient.auth.signOut(); mostrarTela('login'); msgErro.style.color = "red"; msgErro.innerText = "Usuário não encontrado na base de dados."; return; }
            if (cliente.ativo === false) { await supabaseClient.auth.signOut(); mostrarTela('login'); msgErro.style.color = "red"; msgErro.innerText = "⚠️ ACESSO BLOQUEADO. Plano expirado. Contate o suporte."; return; }
            clienteId = cliente.id; msgErro.innerText = ""; mostrarTela('app'); buscarTalhoes();
        }

        async function buscarTalhoes() {
            const { data, error } = await supabaseClient.from('talhoes').select('id, codigo_talhao, geom, imagem_ndvi, data_ndvi, ndvi_medio, area_hectares').eq('cliente_id', clienteId).eq('tem_ndvi', true);
            if (!error) { dadosTalhoes = data; renderizarLista(dadosTalhoes); iniciarMapa(); }
        }

        function renderizarLista(talhoes) {
            const container = document.getElementById('lista-talhoes');
            container.innerHTML = '';
            document.getElementById('barra-data').innerText = 'Selecione talhões e aguarde...';
            talhoes.forEach(talhao => {
                const div = document.createElement('div');
                div.className = 'item-talhao';
                div.innerHTML = `<input type="checkbox" class="check-talhao" value="${talhao.id}" onchange="atualizarMapa()"><label>${talhao.codigo_talhao}</label>`;
                container.appendChild(div);
            });
        }

        function filtrarLista() { const termo = document.getElementById('campo-busca').value.toLowerCase(); const filtrados = dadosTalhoes.filter(t => t.codigo_talhao.toLowerCase().includes(termo)); renderizarLista(filtrados); }
        function marcarTodos() { document.querySelectorAll('.check-talhao').forEach(cb => cb.checked = true); atualizarMapa(); }
        function desmarcarTodos() { document.querySelectorAll('.check-talhao').forEach(cb => cb.checked = false); atualizarMapa(); }

        function iniciarMapa() {
            if (!mapa) {
                mapa = L.map('mapa', { zoomControl: false }).setView([-20.5, -49.5], 10);
                L.control.zoom({ position: 'topright' }).addTo(mapa); 
                L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles &copy; Esri', maxZoom: 18 }).addTo(mapa);
            }
            setTimeout(() => mapa.invalidateSize(), 300);
        }

        function calcularDiasAtras(dataStr) {
            if (!dataStr) return "";
            const dataImagem = new Date(dataStr + "T00:00:00"); const hoje = new Date(); hoje.setHours(0,0,0,0);
            const dias = Math.floor((hoje - dataImagem) / (1000 * 60 * 60 * 24));
            if (dias === 0) return "Hoje"; if (dias === 1) return "Ontem"; if (dias > 1) return `${dias} dias atrás`; return `Em breve`;
        }

        function atualizarMapa() {
            if (!mapa) return;
            document.getElementById('painel-analise').classList.remove('show'); 
            mapa.eachLayer(layer => { if (layer instanceof L.GeoJSON || layer instanceof L.ImageOverlay) mapa.removeLayer(layer); });
            const checkboxes = document.querySelectorAll('.check-talhao:checked');
            let datasEncontradas = new Set();
            if (checkboxes.length === 0) { document.getElementById('barra-data').innerText = 'Selecione talhões e aguarde...'; return; }
            checkboxes.forEach(cb => {
                const talhao = dadosTalhoes.find(t => t.id === cb.value);
                if (!talhao || !talhao.geom) return;
                try {
                    const geojson = typeof talhao.geom === 'string' ? JSON.parse(talhao.geom) : talhao.geom;
                    L.geoJSON(geojson, { style: { color: 'white', weight: 2, fillOpacity: 0 } }).addTo(mapa);
                    if (talhao.imagem_ndvi) { const bounds = L.geoJSON(geojson).getBounds(); const imageUrl = `data:image/png;base64,${talhao.imagem_ndvi}`; L.imageOverlay(imageUrl, bounds, { opacity: 0.9 }).addTo(mapa); }
                    if (talhao.data_ndvi) datasEncontradas.add(talhao.data_ndvi);
                } catch (e) { console.error("Erro:", e); }
            });
            const grupo = L.featureGroup();
            checkboxes.forEach(cb => { const talhao = dadosTalhoes.find(t => t.id === cb.value); if (talhao && talhao.geom) { const geojson = typeof talhao.geom === 'string' ? JSON.parse(talhao.geom) : talhao.geom; L.geoJSON(geojson).addTo(grupo); } });
            if (checkboxes.length > 0) mapa.fitBounds(grupo.getBounds().pad(0.2));
            if (datasEncontradas.size > 0) { let textosFormatados = []; datasEncontradas.forEach(data => textosFormatados.push(`${data} (${calcularDiasAtras(data)})`)); document.getElementById('barra-data').innerText = "Imagens de: " + textosFormatados.join(' | '); } else { document.getElementById('barra-data').innerText = 'Data indisponível'; }
            if (isMobile) { fecharListaMobile(); }
        }

        function calcularAreaGeoJSON(geojson) {
            let area = 0; const coords = geojson.coordinates[0]; const R = 6378137; 
            for (let i = 0; i < coords.length; i++) {
                const [lon1, lat1] = coords[i]; const nextIndex = (i + 1) % coords.length; const [lon2, lat2] = coords[nextIndex];
                const radLat1 = lat1 * Math.PI / 180; const radLat2 = lat2 * Math.PI / 180; const deltaLon = (lon2 - lon1) * Math.PI / 180;
                area += deltaLon * (2 + Math.sin(radLat1) + Math.sin(radLat2));
            }
            area = Math.abs(area * R * R / 2); return area / 10000; 
        }

        function classificarCor(r, g, b) {
            const cores = [
                {r:110, g:70,  b:40,  id:1, nome:"Solo/Água", ndvi:0.0},
                {r:215, g:30,  b:25,  id:2, nome:"Muito Baixo", ndvi:0.075},
                {r:240, g:140, b:40,  id:3, nome:"Baixo", ndvi:0.225},
                {r:250, g:220, b:60,  id:4, nome:"Médio", ndvi:0.375},
                {r:130, g:200, b:60,  id:5, nome:"Bom", ndvi:0.525},
                {r:20,  g:130, b:40,  id:6, nome:"Alto", ndvi:0.80}
            ];
            let minDist = 999999; let melhorClasse = cores[0];
            for(let c of cores) { let dist = Math.sqrt(Math.pow(r-c.r, 2) + Math.pow(g-c.g, 2) + Math.pow(b-c.b, 2)); if(dist < minDist) { minDist = dist; melhorClasse = c; } }
            return melhorClasse;
        }

        async function analisarSelecao() {
            const checkboxes = document.querySelectorAll('.check-talhao:checked');
            if (checkboxes.length === 0) { alert("Selecione pelo menos um talhão na lista para analisar."); return; }

            let areaTotal = 0, ndviTotal = 0, pixelsValidos = 0, contagem = [0, 0, 0, 0, 0, 0]; 
            const painelAnalise = document.getElementById('painel-analise');
            const conteudoAnalise = document.getElementById('conteudo-analise');
            
            conteudoAnalise.innerHTML = "Processando imagens... Aguarde.";
            painelAnalise.classList.add('show');

            let canvas = document.createElement('canvas'); let ctx = canvas.getContext('2d');
            canvas.width = 512; canvas.height = 512;

            for (let cb of checkboxes) {
                const talhao = dadosTalhoes.find(t => t.id === cb.value);
                if (talhao && talhao.geom) {
                    const geojson = typeof talhao.geom === 'string' ? JSON.parse(talhao.geom) : talhao.geom;
                    areaTotal += calcularAreaGeoJSON(geojson);

                    if (talhao.imagem_ndvi) {
                        try {
                            await new Promise((resolve) => {
                                let img = new Image(); img.crossOrigin = "Anonymous";
                                img.onload = function() {
                                    ctx.clearRect(0, 0, 512, 512); ctx.drawImage(img, 0, 0, 512, 512);
                                    let imageData = ctx.getImageData(0, 0, 512, 512).data;
                                    for (let i = 0; i < imageData.length; i += 4) {
                                        let r = imageData[i], g = imageData[i+1], b = imageData[i+2], a = imageData[i+3];
                                        if (a > 0) { let classe = classificarCor(r, g, b); contagem[classe.id - 1]++; pixelsValidos++; ndviTotal += classe.ndvi; }
                                    }
                                    resolve();
                                };
                                img.onerror = function() { resolve(); };
                                img.src = `data:image/png;base64,${talhao.imagem_ndvi}`;
                            });
                        } catch(e) { console.error("Erro Canvas:", e); }
                    }
                }
            }

            if (pixelsValidos > 0) {
                let ndviMedio = ndviTotal / pixelsValidos;
                
                let culturaSelect = document.getElementById('select-cultura');
                let cultura = culturaSelect.value;
                let unidade = "sc/ha"; let fator = 100; let totalUnidade = 0; let estimativaUnidade = 0;

                if(cultura === "cana") {
                    unidade = "t/ha"; 
                    fator = 150; 
                    estimativaUnidade = Math.round(ndviMedio * fator);
                    totalUnidade = Math.round(estimativaUnidade * areaTotal);
                } else {
                    estimativaUnidade = Math.round(ndviMedio * fator);
                    totalUnidade = Math.round(estimativaUnidade * areaTotal);
                }

                // HTML DA LEGENDA COM QUADRADOS DE COR
                const coresLegenda = [
                    {cor:"rgb(110,70,40)",  nome:"Solo/Água"},
                    {cor:"rgb(215,30,25)",  nome:"Muito Baixo"},
                    {cor:"rgb(240,140,40)", nome:"Baixo"},
                    {cor:"rgb(250,220,60)", nome:"Médio"},
                    {cor:"rgb(130,200,60)", nome:"Bom"},
                    {cor:"rgb(20,130,40)",  nome:"Alto"}
                ];

                let html = `<div class="titulo-painel">📊 ANÁLISE DE BIOMASSA</div>`;
                
                for(let i=0; i<6; i++) {
                    let perc = ((contagem[i]/pixelsValidos)*100).toFixed(1);
                    html += `<div class="linha-legenda">
                                <div class="cor-quadrado" style="background-color:${coresLegenda[i].cor};"></div>
                                <span>${coresLegenda[i].nome}: ${perc}%</span>
                             </div>`;
                }

                html += `<div style="border-top:1px solid rgba(255,255,255,0.3); margin:8px 0;"></div>`;
                html += `🌾 Área: <b>${areaTotal.toFixed(2)} ha</b><br>`;
                html += `📈 NDVI Médio: <b>${ndviMedio.toFixed(2)}</b><br>`;
                html += `🚜 Estimativa: <b>${estimativaUnidade} ${unidade}</b><br>`;
                html += `📦 Total: <b>${totalUnidade} ${unidade.replace('/ha','')}</b>`;

                conteudoAnalise.innerHTML = html;
            } else {
                conteudoAnalise.innerHTML = `Área: ${areaTotal.toFixed(2)} ha.<br>Sem pixels para ler.`;
            }
        }

        async function deslogar() { await supabaseClient.auth.signOut(); clienteId = null; dadosTalhoes = []; mostrarTela('login'); }
    </script>
</body>
</html>
