name: Atualiza NDVI

on:
  schedule:
    # Roda nos dias 1, 6, 11, 16, 21 e 26 de cada mes, as 12h (UTC) = 09h de Brasilia
    - cron: '0 12 1,6,11,16,21,26 * *'
  workflow_dispatch:          # permite rodar manualmente pelo botao

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas
        run: pip install requests pillow supabase

      - name: Gerar e gravar NDVI
        run: python gerador_ndvi.py
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
