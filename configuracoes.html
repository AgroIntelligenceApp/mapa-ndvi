<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro Intelligence | Configurações</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .menu-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: all 0.2s; text-decoration: none; }
        .menu-item:hover { background-color: #f0f0f0; }
        .menu-item.active { background-color: #2d8659; color: white; }
        .menu-category-title { font-size: 11px; text-transform: uppercase; color: #6b7280; margin-top: 15px; margin-bottom: 5px; padding-left: 5px; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    
    <header class="bg-[#1a472a] text-white p-4 flex justify-between items-center shadow-md z-20">
        <button onclick="toggleSidebar()" class="hover:bg-white/10 p-2 rounded">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
        </button>
        <div class="flex items-center gap-2">
            <img src="logo.png" alt="Logo" class="h-8 w-8 object-contain" onerror="this.style.display='none'">
            <h1 class="text-lg font-bold">Agro Intelligence</h1>
        </div>
        <div style="width: 50px;"></div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="w-64 bg-white border-r border-gray-200 flex flex-col overflow-y-auto transition-all duration-300 md:translate-x-0 -translate-x-full fixed md:relative h-full z-10">
            <div class="p-4">
                <div class="border-b pb-2 mb-2"><h2 class="text-md font-bold text-gray-800" id="nome-cliente">Carregando...</h2></div>
                <div class="menu-category-title">Principal</div>
                <a href="dashboard.html" class="menu-item">🏠 Visão Geral</a>
                <a href="index.html?view=map&mode=limites" class="menu-item">🗺️ Mapas</a>
                <div class="menu-category-title">Monitoramento</div>
                <a href="index.html?view=map&mode=ndvi" class="menu-item">🛰️ NDVI</a>
                <a href="chuvas.html" class="menu-item">🌧️ Clima & Chuva</a>
                <div class="menu-category-title">Gestão</div>
                <a href="kpi.html" class="menu-item">📊 Indicadores</a>
                <div class="menu-category-title">Sistema</div>
                <a href="configuracoes.html" class="menu-item active">⚙️ Configurações</a>
                <a href="index.html" class="menu-item" style="color: #dc3545;">🚪 Sair</a>
            </div>
        </aside>

        <!-- CONTEÚDO -->
        <main class="flex-1 p-6 md:p-8 overflow-y-auto">
            <h2 class="text-2xl font-bold text-gray-800 mb-8">⚙️ Configurações da Conta</h2>

            <div class="flex flex-col gap-8 max-w-2xl">
                
                <!-- CARD: DADOS DE ACESSO -->
                <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
                    <h3 class="text-lg font-bold text-gray-700 mb-4">Dados de Acesso</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-500 mb-1">Email / WhatsApp (Login)</label>
                            <input type="text" id="campo-email" class="w-full bg-gray-100 border border-gray-200 rounded-lg px-4 py-2 text-gray-500" disabled>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-500 mb-1">Nome de Exibição</label>
                            <input type="text" id="campo-nome" class="w-full bg-white border border-gray-300 rounded-lg px-4 py-2 text-gray-700 focus:ring-2 focus:ring-green-500 outline-none">
                        </div>
                        <button onclick="salvarNome()" class="bg-[#2d8659] text-white font-bold py-2 px-6 rounded-lg hover:bg-[#1a472a] transition">Salvar Nome</button>
                    </div>
                </div>

                <!-- CARD: SEGURANÇA -->
                <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
                    <h3 class="text-lg font-bold text-gray-700 mb-4">Segurança</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-500 mb-1">Nova Senha</label>
                            <input type="password" id="campo-nova-senha" placeholder="Mínimo 6 caracteres" class="w-full bg-white border border-gray-300 rounded-lg px-4 py-2 text-gray-700 focus:ring-2 focus:ring-green-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-500 mb-1">Confirmar Nova Senha</label>
                            <input type="password" id="campo-confirma-senha" placeholder="Repita a nova senha" class="w-full bg-white border border-gray-300 rounded-lg px-4 py-2 text-gray-700 focus:ring-2 focus:ring-green-500 outline-none">
                        </div>
                        <button onclick="atualizarSenha()" class="bg-[#2d8659] text-white font-bold py-2 px-6 rounded-lg hover:bg-[#1a472a] transition">Atualizar Senha</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const sb = supabase.createClient('https://keiydgyountsuzjybsng.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtlaXlkZ3lvdW50c3V6anlic25nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1ODY1MTksImV4cCI6MjA5ODE2MjUxOX0.Cd3TqUBZsNWV00AZGkrElJVmNlWPccDgtl-n95BVwjg');

        let whatsappAtual = "";
        let tabelaUsuario = "usuarios"; // Padrão: múltiplos usuários. Pode mudar para "clientes" se for o dono.

        window.onload = async () => {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) return window.location.href = 'index.html';
            
            whatsappAtual = session.user.email.replace('@app.ndvi', '');
            document.getElementById('campo-email').value = session.user.email;

            // Busca nome do usuário
            let { data: usuario } = await sb.from('usuarios').select('nome').eq('whatsapp', whatsappAtual).maybeSingle();
            if (usuario) {
                tabelaUsuario = "usuarios";
                document.getElementById('campo-nome').value = usuario.nome || "";
                document.getElementById('nome-cliente').innerText = usuario.nome || "Cliente";
            } else {
                let { data: cli } = await sb.from('clientes').select('nome').eq('whatsapp', whatsappAtual).maybeSingle();
                if (cli) {
                    tabelaUsuario = "clientes";
                    document.getElementById('campo-nome').value = cli.nome || "";
                    document.getElementById('nome-cliente').innerText = cli.nome || "Cliente";
                }
            }
        };

        async function salvarNome() {
            const novoNome = document.getElementById('campo-nome').value;
            const btn = event.target;
            btn.innerText = "Salvando..."; btn.disabled = true;

            const { error } = await sb.from(tabelaUsuario).update({ nome: novoNome }).eq('whatsapp', whatsappAtual);
            if (error) { alert("Erro ao salvar nome."); }
            else { 
                alert("Nome atualizado com sucesso!"); 
                document.getElementById('nome-cliente').innerText = novoNome;
            }
            btn.innerText = "Salvar Nome"; btn.disabled = false;
        }

        async function atualizarSenha() {
            const novaSenha = document.getElementById('campo-nova-senha').value;
            const confirmaSenha = document.getElementById('campo-confirma-senha').value;
            const btn = event.target;
            
            if (novaSenha.length < 6) { alert("A senha deve ter no mínimo 6 caracteres."); return; }
            if (novaSenha !== confirmaSenha) { alert("As senhas não coincidem."); return; }

            btn.innerText = "Atualizando..."; btn.disabled = true;
            
            const { data, error } = await sb.auth.updateUser({ password: novaSenha });
            if (error) { alert("Erro ao atualizar senha: " + error.message); }
            else { 
                alert("Senha atualizada com sucesso!"); 
                document.getElementById('campo-nova-senha').value = "";
                document.getElementById('campo-confirma-senha').value = "";
            }
            btn.innerText = "Atualizar Senha"; btn.disabled = false;
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); }
    </script>
</body>
</html>
